plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Flutter version.
// GitHub Actions alatt nincs feltétlenül local.properties,
// ezért biztonságos alapértékeket használunk.
def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def debugKeystoreProperties = new Properties()
def debugKeystorePropertiesFile = rootProject.file("debugkey.properties")

if (debugKeystorePropertiesFile.exists()) {
    debugKeystoreProperties.load(
        new FileInputStream(debugKeystorePropertiesFile)
    )
}

// Magical code that fixes builds.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
    }
}

android {
    namespace = "app.zan1456.folio"

    ndkVersion = "28.2.13676358"

    flavorDimensions "distribution"

    productFlavors {
        github {
            dimension "distribution"
        }

        playstore {
            dimension "distribution"
        }
    }

    compileSdkVersion 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
        disable "Instantiatable"
        checkReleaseBuilds false
        abortOnError false
    }

    defaultConfig {
        applicationId "app.zan1456.folio"

        minSdkVersion 24
        targetSdkVersion 36

        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        multiDexEnabled true

        resConfigs "en"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            keyAlias "androiddebugkey"

            storeFile file(
                System.properties['user.home'] +
                "/.android/debug.keystore"
            )

            storePassword "android"
            keyPassword "android"
        }

        release {
            // Use the real release keystore when key.properties exists.
            if (keystorePropertiesFile.exists() &&
                    keystoreProperties['storeFile'] != null) {

                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']

                storeFile file(
                    keystoreProperties['storeFile']
                )

                storePassword keystoreProperties['storePassword']
            } else {
                // GitHub Actions fallback.
                // This allows the CI release APK to be built without
                // a private release keystore.
                keyAlias "androiddebugkey"
                keyPassword "android"
                storePassword "android"

                storeFile file(
                    System.properties['user.home'] +
                    "/.android/debug.keystore"
                )
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release

            shrinkResources true
            minifyEnabled true

            debuggable false
            jniDebuggable false

            renderscriptDebuggable false
            pseudoLocalesEnabled false

            zipAlignEnabled true
            crunchPngs true

            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.android.support:multidex:2.0.1'

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.21"

    implementation 'joda-time:joda-time:2.9.4'

    androidTestImplementation 'androidx.test:runner:1.1.1'

    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation 'androidx.window:window:1.0.0'

    implementation 'androidx.window:window-java:1.0.0'

    // HyperIsland-ToolKit: Xiaomi HyperOS Living Island support
    implementation 'io.github.d4viddf:hyperisland_kit:0.4.3'

    // Wearable Data Layer – phone ↔ WearOS communication
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'

    // WorkManager – daily 7 AM morning sync to watch
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
}